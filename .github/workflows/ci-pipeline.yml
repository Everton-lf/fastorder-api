name: Esteira de Integracao Continua (CI)

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  build-and-test:
    runs-on: ubuntu-22.04 # Fixa a versão estável do Ubuntu que possui suporte nativo ao Python 3.9

    steps:
      - name: 1. Baixar o codigo fonte (Checkout)
        uses: actions/checkout@v4

      - name: 2. Configurar o ambiente Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.9'

      - name: 3. Instalar dependencias
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: 4. Validacao Estatica (Lint com Flake8)
        run: |
          flake8 --count --select E9,F63,F7,F82 --show-source --statistics

      - name: 5. Rodar Testes Automatizados (Pytest)
        run: |
          pytest -v

      - name: 6. Testar o Build do Docker
        run: |
          docker build -t fastorder-api-test .